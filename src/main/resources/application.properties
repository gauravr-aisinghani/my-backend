spring.application.name=dynamicCrud

# ============================
# SERVER (Render)
# ============================
server.port=${PORT:8080}

# ============================
# DATABASE (Render / Aiven)
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Updated Hibernate dialect (MySQL8Dialect is deprecated)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# SESSION (Spring Session JDBC)
# ============================
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# \u23F3 Session Auto Logout (10m by default)
spring.session.timeout=10m

# Cookie must match SecurityConfig serializer
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None

# ============================
# FRONTEND ORIGIN (Netlify)
# ============================
app.frontend.origin=${FRONTEND_ORIGIN}

# ============================
# MAIL CONFIG
# ============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================
# JACKSON CONFIG
# ============================
spring.jackson.property-naming-strategy=SNAKE_CASE

# ============================
# CLOUDINARY
# ============================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# ============================
# FALLBACK ID CARD PATH
# ============================
# Used by DriverFinalSubmissionServiceImpl
# Can override via environment variable FALLBACK_IDCARD_PATH
app.fallback.idcard.path=${FALLBACK_IDCARD_PATH:/app/fallback/idcard.png}
